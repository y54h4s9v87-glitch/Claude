# Paste into ~/VideoUploads/accounts.toml once each channel exists.
# Set the real handle YouTube gave you, then enabled = true.
#
# Every channel posts every 2 hours (8am-midnight) on its own offset; jitter_minutes moves each post a
# different amount around it, and shuffle = true gives every channel its
# own random order for each batch you drop in the inbox.

[[account]]
id = "gta-daily-clips"
platform = "youtube"
handle = "@GTADailyClips"
login_hint = "Same Google login. Avatar -> Switch account -> GTA Daily Clips"
days = "daily"
times = ["08:52", "10:52", "12:52", "14:52", "16:52", "18:52", "20:52", "22:52"]
max_per_day = 8
jitter_minutes = 20
shuffle = true
hashtags = ["#gta6", "#gtaclips", "#shorts"]
caption_template = "{description}\n\n{hashtags}"
enabled = false

