# Paste into ~/VideoUploads/accounts.toml once each channel exists.
# Set the real handle YouTube gave you, then enabled = true.

[[account]]
id = "gta-daily-clips"
platform = "youtube"
handle = "@GTADailyClips"
login_hint = "Same Google login. Avatar -> Switch account -> GTA Daily Clips"
days = "daily"
times = ["12:07"]
hashtags = ["#gta6", "#shorts"]
caption_template = "{description}\n\n{hashtags}"
enabled = false

